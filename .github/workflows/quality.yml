name: quality

on:
  push:
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:components
      - run: pnpm test:integration
      - run: pnpm test:e2e
      - run: pnpm test:security
      - run: pnpm test:parity
      - run: pnpm build

  legacy-python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: legacy/python/pyproject.toml
      - run: python -m pip install -e "legacy/python[dev]"
      - run: python -m ruff check legacy/python
      - run: python -m ruff format --check legacy/python
      - run: python -m pytest -c legacy/python/pyproject.toml --basetemp=legacy/python/.pytest-tmp legacy/python/tests
      - run: python -m build legacy/python
